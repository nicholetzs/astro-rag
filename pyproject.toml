[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-rag"
version = "0.1.0"
description = "RAG pipeline and evaluation for Astronomy data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "astro-rag team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
